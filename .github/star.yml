name: Generate Garland

on:
  schedule:
    - cron: "0 */12 * * *" # Автозапуск каждые 12 часов
  workflow_dispatch: # Позволяет запускать вручную кнопкой в панели Actions
  push:
    branches:
    - main # Запуск при обновлении профиля

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Генерация змейки из квадратов активности (только светлые/темно-серые и белые тона)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ruslandreev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      # Сохранение готовой гирлянды в ветку output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
