<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20">
  <line x1="0" y1="10" x2="900" y2="10"
        stroke="#67d934"
        stroke-width="3"
        stroke-dasharray="4 6 8 6 12 6 16 6 20 6 25 6 30 6 35"
        stroke-linecap="round"
        opacity="0.95">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-300"
             dur="3s"
             repeatCount="indefinite"/>
  </line>
</svg>
