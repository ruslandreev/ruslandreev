name: Generate Garland

on:
  schedule:
    - cron: "0 */12 * * *" # Автоматический перезапуск каждые 12 часов
  workflow_dispatch: # Дает возможность запускать кнопкой вручную
  push:
    branches:
      - main # Запуск при коммитах в главную ветку

jobs:
  generate:
    permissions: 
      contents: write # Дает право GitHub-боту создавать ветки и файлы в репозитории
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Скачивает репозиторий, чтобы с ним работать
      - name: checkout
        uses: actions/checkout@v3

      # Генерирует темную гирлянду из вашей сетки активности
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ruslandreev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Сохраняет созданный SVG-файл в отдельную ветку output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
